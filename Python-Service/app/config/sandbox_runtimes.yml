# Sandbox runtime profiles — image + dependency installer + probe templates.
#
# Image policy: the executor FIRST searches images already pulled on the sandbox
# daemon (docker images); composer:2 is preloaded in dind-storage. A pull is
# attempted only when the daemon has egress; otherwise probes report an honest
# "image unavailable" failure — nothing ever auto-installs a runtime silently.
#
# Tier 1 (install) runs the installer on a WRITABLE networked copy.
# Tier 2 (probes) re-runs the same project READ-ONLY under runsc, no network,
# with the _PROBE_ENV harness (sqlite :memory:, array drivers) injected.
runtimes:
  # Shared composer-based runtime (anchor reused by every PHP-family framework).
  php: &php_runtime
    image: composer:2
    # PHP-floor → image map (built via ../docker/php-runtime/Dockerfile and
    # docker-load'ed into the DinD daemon). The executor reads composer.json
    # require.php and picks the matching floor — composer:2 tracks PHP 8.5,
    # which real projects requiring ^8.3 (+bcmath/gd) cannot boot on.
    # A floor without an image falls back to the nearest lower one, then to
    # `image` (honest detail in the job result).
    php_versions:
      "8.2": php-composer:8.2
      "8.3": php-composer:8.3
      "8.4": php-composer:8.4
    # require-dev packages are needed by real projects: Telescope & co. are
    # referenced by their own config/app.php providers, and the `tests` probe
    # runs phpunit. A prod-only install then crashes at boot.
    dev: true
    # Marker file locating the real app dir: uploads often wrap the project in
    # a top-level folder (Archive/…). Staging binds the whole workspace, and
    # install/probe commands run from the dir containing this marker.
    manifest: composer.json
    # Dependency installer argv (tier 1). --no-scripts skips the repo's own
    # composer scripts (post-autoload package:discover etc.) for deterministic,
    # lockdown-by-default installs — enable scripts only when a project needs
    # them (CI semantics).
    installer:
      - composer
      - install
      - --no-interaction
      - --no-progress
      - --prefer-dist
      - --no-dev
      - --no-scripts
    probes:
      routes:
        - php
        - artisan
        - route:list
        - --json
      schedule:
        - php
        - artisan
        - schedule:list
      tests:
        # OPT-IN probe: phpunit needs dev deps (installed — dev: true) AND a
        # provisioned database. Real projects require migrations/factories +
        # seeds; run `php artisan migrate:fresh --seed` (sqlite via _PROBE_ENV)
        # in a run_command prep step first. The default sandbox_analyze route
        # ships probes [routes, schedule] only; enable tests per project when
        # DB preconditions are known to hold.
        - ./vendor/bin/phpunit
        - --no-coverage

  # Laravel ships the same composer toolchain — probe templates identical.
  laravel: *php_runtime
  # TODO(future): django → python runtime (pip install -r + manage.py probes);
  # rails → ruby (bundle install + rails routes); express → node (npm ci).
  # Each needs its runtime image preloaded/pulled into the DinD backend.

