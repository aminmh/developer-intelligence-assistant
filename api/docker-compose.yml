services:
  python-api:
    build: ./Python-Service
    container_name: python_api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Indexing runs phpactor inside this container when no analyzer worker exists
    # (~400 MiB next to ~450 MiB of chunks for a 14k-chunk PHP revision).
    mem_limit: 1536m
    # asyncio loop (not uvloop) so ragas's nest_asyncio can patch the event loop.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "9002", "--loop", "asyncio"]
    environment:
      TUS_PUBLIC_URL: http://localhost:1080/files/
      UPLOAD_TOKEN_SECRET: ${UPLOAD_TOKEN_SECRET}
      TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET}
      DOWNLOAD_TOKEN_SECRET: ${DOWNLOAD_TOKEN_SECRET}
      RAG_CALLBACK_SECRET: ${RAG_CALLBACK_SECRET}
      APP_DEPLOYMENT_MODE: ${APP_DEPLOYMENT_MODE:-developer}
      ANALYZER_WORKER_URL: ${ANALYZER_WORKER_URL:-https://analyzer-worker:9443}
      ANALYZER_WORKER_CERT_SHA256: ${ANALYZER_WORKER_CERT_SHA256:-}
      ANALYZER_WORKER_CA_FILE: /run/analyzer-tls/worker-ca.crt
      ANALYZER_WORKER_CLIENT_CERT_FILE: /run/analyzer-tls/api.crt
      ANALYZER_WORKER_CLIENT_KEY_FILE: /run/analyzer-tls/api.key
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      LLM_CONTEXT_WINDOW_TOKENS: ${LLM_CONTEXT_WINDOW_TOKENS:-0}
      ASSESSMENT_REQUEST_TOKEN_LIMIT: ${ASSESSMENT_REQUEST_TOKEN_LIMIT:-0}
      LSP_WARMUP_ENABLED: ${LSP_WARMUP_ENABLED:-false}
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      TELEMETRY_CLICKHOUSE_URL: ${TELEMETRY_CLICKHOUSE_URL:-http://telemetry-clickhouse:8123}
      TELEMETRY_CLICKHOUSE_USER: ${TELEMETRY_CLICKHOUSE_USER:-telemetry}
      TELEMETRY_CLICKHOUSE_PASSWORD: ${TELEMETRY_CLICKHOUSE_PASSWORD:-telemetry-local-dev-only}
      TELEMETRY_CLICKHOUSE_DATABASE: ${TELEMETRY_CLICKHOUSE_DATABASE:-telemetry}
      TELEMETRY_CLICKHOUSE_TABLE: ${TELEMETRY_CLICKHOUSE_TABLE:-otel_traces}
      TELEMETRY_CLICKHOUSE_FULL_TABLE: ${TELEMETRY_CLICKHOUSE_FULL_TABLE:-otel_spans_full}
      TELEMETRY_RETENTION_HOURS: ${TELEMETRY_RETENTION_HOURS:-72}
      TELEMETRY_AGGREGATION_RETENTION_HOURS: ${TELEMETRY_AGGREGATION_RETENTION_HOURS:-72}
      TELEMETRY_RECORDING_PERCENT: ${TELEMETRY_RECORDING_PERCENT:-10}
      TELEMETRY_SAMPLING_POLICY_PATH: /var/lib/devassistant/runtime/sampling-policy.json
      TELEMETRY_RUNTIME_STATE_DIR: /var/lib/devassistant/runtime
      SSH_AUTH_SOCK: /run/devassistant/runtime-host/ssh-agent.sock
      TELEMETRY_RUNTIME_CONTROL_DIR: /var/lib/devassistant/collector-control
      TELEMETRY_COLLECTOR_BASE_CONFIG: /etc/devassistant/collector-runtime.base.yaml
      TELEMETRY_OTLP_ENDPOINT: ${TELEMETRY_OTLP_ENDPOINT:-http://host.docker.internal:24318}
      TELEMETRY_CI_PROJECT_TOKENS: ${TELEMETRY_CI_PROJECT_TOKENS:-}
      TELEMETRY_HOST_SCOPES: ${TELEMETRY_HOST_SCOPES:-}
      # MinIO/S3 storage (rag uploads) — formerly owned by php-ast.
      AWS_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_TUS_BUCKET: tus-uploads
      PHP_CLI_ROOT: /opt/php-cli
    volumes:
      - "./Python-Service/app/:/app"
      - "./Python-Service/logs/:/app/logs"
      - "./Python-Service/php/:/opt/php-cli"
      - telemetry-policy-data:/var/lib/devassistant/runtime
      - telemetry-collector-control:/var/lib/devassistant/collector-control
      - "${RUNTIME_SSH_AGENT_SOURCE:-${HOME}/.local/state/devassistant/runtime-host/ssh-agent.sock}:/run/devassistant/runtime-host/ssh-agent.sock:ro"
      - ./telemetry-dev/collector-runtime.yaml:/etc/devassistant/collector-runtime.base.yaml:ro
      - "${ANALYZER_API_TLS_DIR:-./analyzer-worker/certs/api}:/run/analyzer-tls:ro"
    depends_on:
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    networks:
      - default
      - devassistant_net
      - telemetry_runtime
      - analyzer_private

  # Optional local SonarQube services. The worker can run alone against a remote SonarQube server.
  analyzer-db:
    profiles: [analyzer]
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${ANALYZER_POSTGRES_PASSWORD:-}
    volumes:
      - analyzer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    restart: unless-stopped
    networks: [analyzer_private]

  sonarqube:
    profiles: [analyzer]
    image: ${SONARQUBE_IMAGE:-sonarqube:26.9.0.129388-community}
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://analyzer-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${ANALYZER_POSTGRES_PASSWORD:-}
      SONAR_WEB_HOST: 0.0.0.0
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    depends_on:
      analyzer-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/api/system/status >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s
    mem_limit: 4g
    cpus: 2.0
    restart: unless-stopped
    networks: [analyzer_private]

  analyzer-worker:
    profiles: [analyzer]
    build:
      context: .
      dockerfile: analyzer-worker/Dockerfile
    environment:
      APP_DEPLOYMENT_MODE: ${APP_DEPLOYMENT_MODE:-developer}
      ANALYZER_WORKER_TLS_CERT_FILE: /run/analyzer-tls/worker.crt
      ANALYZER_WORKER_TLS_KEY_FILE: /run/analyzer-tls/worker.key
      ANALYZER_WORKER_API_CA_FILE: /run/analyzer-tls/api-ca.crt
      ANALYZER_ALLOWED_SONAR_HOSTS: ${ANALYZER_ALLOWED_SONAR_HOSTS:-sonarqube}
      # Joern loads a native zstd library from Java's temp dir; /tmp stays noexec.
      ANALYZER_JAVA_TMPDIR: /var/tmp/analyzer-java
    ports:
      - "${ANALYZER_WORKER_BIND:-127.0.0.1}:${ANALYZER_WORKER_PORT:-9443}:9443"
    volumes:
      - "${ANALYZER_WORKER_TLS_DIR:-./analyzer-worker/certs/worker}:/run/analyzer-tls:ro"
    group_add:
      - "${ANALYZER_CERT_GID:-10001}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=2g,mode=1777
      - /var/tmp/analyzer-java:rw,exec,nosuid,size=1g,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; raise SystemExit(0 if b'/opt/analyzer-worker/worker.py' in Path('/proc/1/cmdline').read_bytes() else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0
    restart: unless-stopped
    networks: [analyzer_private, default]

  # The only ingress intended for per-host deployment reports. Host agents
  # join telemetry_ingress; the published port is loopback-only for local use.
  telemetry-caddy:
    image: caddy:2.10.2-alpine
    # Runtime setup provisions the mTLS identity before enabling this ingress.
    profiles: [runtime-host]
    ports:
      - "${TELEMETRY_INGRESS_BIND:-127.0.0.1}:${TELEMETRY_INGRESS_PORT:-9443}:9443"
    volumes:
      - ./telemetry-dev/host/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TELEMETRY_INGRESS_CERT_DIR:-./telemetry-dev/host/certs/ingress}:/etc/caddy/identity:ro
      - telemetry-caddy-data:/data
      - telemetry-caddy-config:/config
    depends_on:
      - python-api
    networks:
      - default
      - telemetry_ingress
    restart: unless-stopped

  # tusd config note: -hooks-enabled-events is intentionally set to post-finish
  # only. The hook is handled by python-api, which verifies the upload session's
  # JWT and moves the finished ZIP under rag-uploads/{session}/{filename}.
  tusd:
    image: tusproject/tusd:v2.10.0
    mem_limit: 512m
    ports:
      - "1080:1080"
    command:
      - -host=0.0.0.0
      - -port=1080
      - -base-path=/files/
      - -behind-proxy
      - -s3-bucket=tus-uploads
      - -s3-endpoint=http://minio:9000
      - -max-size=2147483648
      - -hooks-http=http://python-api:9002/api/internal/tusd/hooks
      - -hooks-enabled-events=post-finish
      - -hooks-http-forward-headers=Authorization
      - -cors-allow-origin=${WEB_ORIGIN:-http://localhost:3000}
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      python-api:
        condition: service_started
    networks:
      - default
      - devassistant_net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    mem_limit: 1g
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - "./minio-data/:/data"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - default
      - devassistant_net

  # One-shot: creates the tus-uploads bucket tusd's S3 store writes to. No
  # bucket exists by default, and tusd itself does not create one on startup.
  # Waits for minio's healthcheck (not just "container started") before
  # running, so the "connection refused" race during minio's own startup
  # doesn't show up as noisy (though harmless/self-retrying) error output.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1) do sleep 1; done;
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb -p local/tus-uploads || true;
      exit 0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - default
      - devassistant_net

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: qdrant
    mem_limit: 1g
    volumes:
      - "qdrant-data:/qdrant/storage"
    ports:
      - "6333:6333"
      - "6334:6334"

  # Property-graph backend for the LlamaIndex hybrid retrieval layer. Holds
  # CodeSymbol nodes + CALLS edges (structure only); embeddings live in Qdrant.
  # No APOC / vector-index plugins required — the layer uses core Cypher only.
  neo4j:
    image: neo4j:5.26.0
    container_name: neo4j
    mem_limit: 1g
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      # Heap + page cache must leave room for JVM/off-heap use (~300 MiB) inside
      # mem_limit. Graph writes are 1,000 structure-only rows, so 384m is ample.
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$${NEO4J_USER:-neo4j}\" -p \"$${NEO4J_PASSWORD:-password}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - "neo4j-data:/data"
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - default
      - devassistant_net

  telemetry-clickhouse:
    image: clickhouse/clickhouse-server:25.8.4.13
    profiles: [runtime-local]
    environment:
      CLICKHOUSE_DB: ${TELEMETRY_CLICKHOUSE_DATABASE:-telemetry}
      CLICKHOUSE_USER: ${TELEMETRY_CLICKHOUSE_USER:-telemetry}
      CLICKHOUSE_PASSWORD: ${TELEMETRY_CLICKHOUSE_PASSWORD:-telemetry-local-dev-only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - telemetry-runtime-data:/var/lib/clickhouse
      - ./telemetry-dev/clickhouse-memory.xml:/etc/clickhouse-server/config.d/zz-runtime-memory.xml:ro
      - ./telemetry-dev/clickhouse-runtime.xml:/etc/clickhouse-server/config.d/zz-runtime-tuning.xml:ro
      - ./telemetry-dev/clickhouse-users-memory.xml:/etc/clickhouse-server/users.d/zz-runtime-memory.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 2g
    restart: unless-stopped
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    networks: [telemetry_runtime]

  telemetry-clickhouse-router:
    build:
      context: ./telemetry-dev
      dockerfile: Dockerfile.collector-runtime
    image: devassistant/otelcol-runtime:0.136.0-phase4
    profiles: [runtime]
    entrypoint: ["/usr/local/bin/clickhouse-router"]
    volumes:
      - telemetry-policy-data:/var/lib/devassistant/runtime:ro
    depends_on:
      python-api:
        condition: service_started
    mem_limit: 64m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [telemetry_runtime]

  runtime-ssh-tunnel:
    build: ./Python-Service
    profiles: [runtime]
    command: ["python", "-m", "app.telemetry.ssh_tunnel"]
    environment:
      TELEMETRY_RUNTIME_STATE_DIR: /var/lib/devassistant/runtime
      SSH_AUTH_SOCK: /run/devassistant/runtime-host/ssh-agent.sock
    volumes:
      - telemetry-policy-data:/var/lib/devassistant/runtime:ro
      - "${RUNTIME_SSH_AGENT_SOURCE:-${HOME}/.local/state/devassistant/runtime-host/ssh-agent.sock}:/run/devassistant/runtime-host/ssh-agent.sock:ro"
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [telemetry_runtime, telemetry_ssh_egress]

  telemetry-collector-runtime:
    build:
      context: ./telemetry-dev
      dockerfile: Dockerfile.collector-runtime
    image: devassistant/otelcol-runtime:0.136.0-phase4
    profiles: [runtime]
    entrypoint: ["/bin/sh", "/usr/local/bin/start-runtime-collector.sh"]
    environment:
      TELEMETRY_CLICKHOUSE_USER: ${TELEMETRY_CLICKHOUSE_USER:-telemetry}
      TELEMETRY_CLICKHOUSE_PASSWORD: ${TELEMETRY_CLICKHOUSE_PASSWORD:-telemetry-local-dev-only}
      TELEMETRY_CLICKHOUSE_DATABASE: ${TELEMETRY_CLICKHOUSE_DATABASE:-telemetry}
      TELEMETRY_RETENTION_HOURS: ${TELEMETRY_RETENTION_HOURS:-72}
      TELEMETRY_AGGREGATION_RETENTION_HOURS: ${TELEMETRY_AGGREGATION_RETENTION_HOURS:-72}
      TELEMETRY_RECORDING_PERCENT: ${TELEMETRY_RECORDING_PERCENT:-10}
    volumes:
      - ./telemetry-dev/start-runtime-collector.sh:/usr/local/bin/start-runtime-collector.sh:ro
      - telemetry-policy-data:/var/lib/devassistant/runtime:ro
    ports:
      - "127.0.0.1:24318:4318"
    depends_on:
      telemetry-clickhouse-router:
        condition: service_started
    mem_limit: 512m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [telemetry_runtime]

  telemetry-collector-reloader:
    image: python:3.12-alpine
    profiles: [runtime]
    command: ["python", "/usr/local/bin/runtime-collector-reloader.py"]
    pid: service:telemetry-collector-runtime
    user: "10001:10001"
    volumes:
      - ./telemetry-dev/runtime-collector-reloader.py:/usr/local/bin/runtime-collector-reloader.py:ro
      - telemetry-policy-data:/var/lib/devassistant/runtime:ro
      - telemetry-collector-control:/var/lib/devassistant/collector-control
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      telemetry-collector-runtime:
        condition: service_started
    networks: [telemetry_runtime]

volumes:
  minio-data:
  qdrant-data:
  neo4j-data:
  telemetry-runtime-data:
  telemetry-policy-data:
  telemetry-collector-control:
  telemetry-caddy-data:
  telemetry-caddy-config:
  analyzer-postgres-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:

networks:
  default: {}
  devassistant_net:
    external: true
  telemetry_runtime:
    internal: true
  telemetry_ssh_egress: {}
  telemetry_ingress:
    name: devassistant_telemetry_ingress
    internal: true
  analyzer_private:
    internal: true
