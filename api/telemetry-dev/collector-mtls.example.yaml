# Merge AFTER collector.yaml for a cross-host receiver; supply mounted PKI files.
# Example: otelcol-contrib --config=collector.yaml --config=collector-mtls.example.yaml
# This is a transport example, not a production deployment or Phase2 SDK wiring.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /etc/otelcol/pki/server.crt
          key_file: /etc/otelcol/pki/server.key
          client_ca_file: /etc/otelcol/pki/clients-ca.crt
          min_version: "1.3"
