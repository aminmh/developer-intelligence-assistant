services:
  sonarqube-db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD in the host .env file}
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    restart: unless-stopped
    networks:
      analyzer_private:
        ipv4_address: 172.21.0.2

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD in the host .env file}
      SONAR_WEB_HOST: 0.0.0.0
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SONARQUBE_HOST_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/api/system/status >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s
    mem_limit: 4g
    cpus: 2.0
    restart: unless-stopped
    networks:
      analyzer_private:
        ipv4_address: 172.21.0.3
      analyzer_worker_sonar:
        ipv4_address: 172.24.0.2
      sonarqube_management: {}

networks:
  analyzer_private:
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/16
  analyzer_ingress:
    ipam:
      config:
        - subnet: 172.23.0.0/16
  analyzer_worker_sonar:
    internal: true
    ipam:
      config:
        - subnet: 172.24.0.0/24
  sonarqube_management: {}

volumes:
  sonarqube-db-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
