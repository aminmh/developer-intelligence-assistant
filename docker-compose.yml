services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_UPLOAD_API_URL: ${VITE_UPLOAD_API_URL:-}
        VITE_TUS_THRESHOLD_BYTES: ${VITE_TUS_THRESHOLD_BYTES:-}
    container_name: web
    env_file:
      - .env
    environment:
      PHP_SERVICE_URL: http://php-ast:9003
      OLLAMA_URL: http://host.docker.internal:11434
      PYTHON_API_URL: http://python-api:9002
    ports:
      - "3000:3000"
    volumes:
      - "./data:/app/data"
    restart: unless-stopped
    networks:
      - default
      - devassistant_net

  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: web-dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PHP_SERVICE_URL: http://php-ast:9003
      OLLAMA_URL: http://host.docker.internal:11434
      PYTHON_API_URL: http://python-api:9002
    ports:
      - "3000:3000"
    volumes:
      - ".:/app"
      - "/app/node_modules"
    profiles:
      - dev
    networks:
      - default
      - devassistant_net

networks:
  default: {}
  devassistant_net:
    external: true
