services:
  python-api:
    build: "./PHP-Service/"
    environment:
      TUS_PUBLIC_URL: http://localhost:1080/files/
      UPLOAD_TOKEN_SECRET: ${UPLOAD_TOKEN_SECRET}
      TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET}
    volumes:
      - "./Python-Service/app/:/app"
    depends_on:
      - tusd
      - minio

  php-ast:
    build: "/PHP-Service/"
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      - minio

  tusd:
    image: tusproject/tusd:latest
    ports:
      - "1080:1080"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    depends_on:
      - minio
    # Configure:
    # - /files as the tus base path
    # - MinIO/S3 as the storage backend
    # - Python's internal endpoint as a post-finish hook
    # Pin the image version and use flags supported by that version.

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - "./minio-data/:/data"
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  minio-data:

