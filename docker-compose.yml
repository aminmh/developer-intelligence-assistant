services:
  python-api:
    build: ./Python-Service
    container_name: python_api
    mem_limit: 1g
    # asyncio loop (not uvloop) so ragas's nest_asyncio can patch the event loop.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "9002", "--loop", "asyncio"]
    environment:
      TUS_PUBLIC_URL: http://localhost:1080/files/
      UPLOAD_TOKEN_SECRET: ${UPLOAD_TOKEN_SECRET}
      TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET}
      DOWNLOAD_TOKEN_SECRET: ${DOWNLOAD_TOKEN_SECRET}
      RAG_CALLBACK_SECRET: ${RAG_CALLBACK_SECRET}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      TELEMETRY_CLICKHOUSE_URL: ${TELEMETRY_CLICKHOUSE_URL:-http://telemetry-clickhouse:8123}
      TELEMETRY_CLICKHOUSE_USER: ${TELEMETRY_CLICKHOUSE_USER:-telemetry}
      TELEMETRY_CLICKHOUSE_PASSWORD: ${TELEMETRY_CLICKHOUSE_PASSWORD:-telemetry-local-dev-only}
      TELEMETRY_CLICKHOUSE_DATABASE: ${TELEMETRY_CLICKHOUSE_DATABASE:-telemetry}
      TELEMETRY_CLICKHOUSE_TABLE: ${TELEMETRY_CLICKHOUSE_TABLE:-otel_traces}
      TELEMETRY_CLICKHOUSE_FULL_TABLE: ${TELEMETRY_CLICKHOUSE_FULL_TABLE:-otel_spans_full}
      TELEMETRY_RETENTION_HOURS: ${TELEMETRY_RETENTION_HOURS:-168}
      TELEMETRY_AGGREGATION_RETENTION_HOURS: ${TELEMETRY_AGGREGATION_RETENTION_HOURS:-168}
      TELEMETRY_RECORDING_PERCENT: ${TELEMETRY_RECORDING_PERCENT:-10}
      TELEMETRY_SAMPLING_POLICY_PATH: /var/lib/devassistant/runtime/sampling-policy.json
      TELEMETRY_OTLP_ENDPOINT: ${TELEMETRY_OTLP_ENDPOINT:-http://host.docker.internal:24318}
      TELEMETRY_CI_PROJECT_TOKENS: ${TELEMETRY_CI_PROJECT_TOKENS:-}
      TELEMETRY_HOST_SCOPES: ${TELEMETRY_HOST_SCOPES:-}
      # MinIO/S3 storage (rag uploads) — formerly owned by php-ast.
      AWS_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_TUS_BUCKET: tus-uploads
      PHP_CLI_ROOT: /opt/php-cli
    volumes:
      - "./Python-Service/app/:/app"
      - "./Python-Service/logs/:/app/logs"
      - "./Python-Service/php/:/opt/php-cli"
      - telemetry-policy-data:/var/lib/devassistant/runtime
    depends_on:
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - default
      - devassistant_net
      - telemetry_runtime

  # The only ingress intended for per-host deployment reports. Host agents
  # join telemetry_ingress; the published port is loopback-only for local use.
  telemetry-caddy:
    image: caddy:2.10.2-alpine
    # Runtime setup provisions the mTLS identity before enabling this ingress.
    profiles: [runtime-host]
    ports:
      - "${TELEMETRY_INGRESS_BIND:-127.0.0.1}:${TELEMETRY_INGRESS_PORT:-9443}:9443"
    volumes:
      - ./telemetry-dev/host/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TELEMETRY_INGRESS_CERT_DIR:-./telemetry-dev/host/certs/ingress}:/etc/caddy/identity:ro
      - telemetry-caddy-data:/data
      - telemetry-caddy-config:/config
    depends_on:
      - python-api
    networks:
      - default
      - telemetry_ingress
    restart: unless-stopped

  # tusd config note: -hooks-enabled-events is intentionally set to post-finish
  # only. The hook is handled by python-api, which verifies the upload session's
  # JWT and moves the finished ZIP under rag-uploads/{session}/{filename}.
  tusd:
    image: tusproject/tusd:v2.10.0
    mem_limit: 512m
    ports:
      - "1080:1080"
    command:
      - -host=0.0.0.0
      - -port=1080
      - -base-path=/files/
      - -s3-bucket=tus-uploads
      - -s3-endpoint=http://minio:9000
      - -max-size=2147483648
      - -hooks-http=http://python-api:9002/api/internal/tusd/hooks
      - -hooks-enabled-events=post-finish
      - -hooks-http-forward-headers=Authorization
      - -cors-allow-origin=${WEB_ORIGIN:-http://localhost:3000}
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      python-api:
        condition: service_started
    networks:
      - default
      - devassistant_net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    mem_limit: 1g
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - "./minio-data/:/data"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - default
      - devassistant_net

  # One-shot: creates the tus-uploads bucket tusd's S3 store writes to. No
  # bucket exists by default, and tusd itself does not create one on startup.
  # Waits for minio's healthcheck (not just "container started") before
  # running, so the "connection refused" race during minio's own startup
  # doesn't show up as noisy (though harmless/self-retrying) error output.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1) do sleep 1; done;
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb -p local/tus-uploads || true;
      exit 0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - default
      - devassistant_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    mem_limit: 1g
    volumes:
      - "qdrant-data:/qdrant/storage"
    ports:
      - "6333:6333"
      - "6334:6334"

  # Property-graph backend for the LlamaIndex hybrid retrieval layer. Holds
  # CodeSymbol nodes + CALLS edges (structure only); embeddings live in Qdrant.
  # No APOC / vector-index plugins required — the layer uses core Cypher only.
  neo4j:
    image: neo4j:5.26.0
    container_name: neo4j
    mem_limit: 1g
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - "neo4j-data:/data"
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - default
      - devassistant_net

  telemetry-clickhouse:
    image: clickhouse/clickhouse-server:25.8.4.13
    profiles: [runtime]
    environment:
      CLICKHOUSE_DB: ${TELEMETRY_CLICKHOUSE_DATABASE:-telemetry}
      CLICKHOUSE_USER: ${TELEMETRY_CLICKHOUSE_USER:-telemetry}
      CLICKHOUSE_PASSWORD: ${TELEMETRY_CLICKHOUSE_PASSWORD:-telemetry-local-dev-only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - telemetry-runtime-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 2g
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    networks: [telemetry_runtime]

  telemetry-collector-runtime:
    build:
      context: ./telemetry-dev
      dockerfile: Dockerfile.collector-runtime
    image: devassistant/otelcol-runtime:0.136.0-phase3
    profiles: [runtime]
    command: ["--config=/etc/otelcol/collector-runtime.yaml"]
    environment:
      TELEMETRY_CLICKHOUSE_USER: ${TELEMETRY_CLICKHOUSE_USER:-telemetry}
      TELEMETRY_CLICKHOUSE_PASSWORD: ${TELEMETRY_CLICKHOUSE_PASSWORD:-telemetry-local-dev-only}
      TELEMETRY_RETENTION_HOURS: ${TELEMETRY_RETENTION_HOURS:-168}
      TELEMETRY_AGGREGATION_RETENTION_HOURS: ${TELEMETRY_AGGREGATION_RETENTION_HOURS:-168}
      TELEMETRY_RECORDING_PERCENT: ${TELEMETRY_RECORDING_PERCENT:-10}
    volumes:
      - ./telemetry-dev/collector-runtime.yaml:/etc/otelcol/collector-runtime.yaml:ro
      - telemetry-policy-data:/var/lib/devassistant/runtime:ro
    ports:
      - "127.0.0.1:24318:4318"
    depends_on:
      telemetry-clickhouse:
        condition: service_healthy
    mem_limit: 512m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [telemetry_runtime]

volumes:
  minio-data:
  qdrant-data:
  neo4j-data:
  telemetry-runtime-data:
  telemetry-policy-data:
  telemetry-caddy-data:
  telemetry-caddy-config:

networks:
  default: {}
  devassistant_net:
    external: true
  telemetry_runtime:
    internal: true
  telemetry_ingress:
    name: devassistant_telemetry_ingress
    internal: true
