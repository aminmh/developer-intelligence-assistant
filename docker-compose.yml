services:
  python-api:
    build: ./Python-Service
    container_name: python_api
    mem_limit: 1g
    # asyncio loop (not uvloop) so ragas's nest_asyncio can patch the event loop.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "9002", "--loop", "asyncio"]
    environment:
      TUS_PUBLIC_URL: http://localhost:1080/files/
      UPLOAD_TOKEN_SECRET: ${UPLOAD_TOKEN_SECRET}
      TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET}
      DOWNLOAD_TOKEN_SECRET: ${DOWNLOAD_TOKEN_SECRET}
      RAG_CALLBACK_SECRET: ${RAG_CALLBACK_SECRET}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    ports:
      - 9002:9002
    volumes:
      - "./Python-Service/app/:/app"
      - "./Python-Service/logs/:/app/logs"
    depends_on:
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - default
      - devassistant_net

  # Handles the RAG document upload pipeline (tusd webhook -> MinIO download ->
  # text extraction -> callback into web's Node server) via RagUploadController,
  # plus the pre-existing (separate, unrelated) ZIP/AST analysis feature.
  php-ast:
    build: ./PHP-Service
    container_name: php-ast
    mem_limit: 1g
    ports:
      - "9003:9003"
    volumes:
      - "./PHP-Service/:/app"
    environment:
      APP_KEY: base64:ArrJMd60BBk+X3TNL9Rtu0wmykL6wYuD7HvwboaO2kc=
      APP_DEBUG: "true"
      CACHE_STORE: file
      SESSION_DRIVER: file
      DB_CONNECTION: sqlite
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_BUCKET: projects
      AWS_TUS_BUCKET: tus-uploads
      UPLOAD_TOKEN_SECRET: ${UPLOAD_TOKEN_SECRET}
      RAG_CALLBACK_SECRET: ${RAG_CALLBACK_SECRET}
      NODE_RAG_CALLBACK_URL: ${NODE_RAG_CALLBACK_URL:-http://web:3000/api/internal/rag-index}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      TUS_PUBLIC_URL: http://localhost:1080/files/
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - default
      - devassistant_net

  # tusd config note: -hooks-enabled-events is intentionally set to post-finish
  # only. There is no pre-create hook validating the upload session's JWT
  # before bytes are accepted (see PHP-Service's RagUploadController for the
  # rationale) -- that's a deferred hardening item, not an oversight.
  tusd:
    image: tusproject/tusd:v2.10.0
    mem_limit: 512m
    ports:
      - "1080:1080"
    command:
      - -host=0.0.0.0
      - -port=1080
      - -base-path=/files/
      - -s3-bucket=tus-uploads
      - -s3-endpoint=http://minio:9000
      - -max-size=2147483648
      - -hooks-http=http://php-ast:9003/api/internal/tusd/hooks
      - -hooks-enabled-events=post-finish
      - -hooks-http-forward-headers=Authorization
      - -cors-allow-origin=${WEB_ORIGIN:-http://localhost:3000}
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      php-ast:
        condition: service_started
    networks:
      - default
      - devassistant_net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    mem_limit: 1g
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - "./minio-data/:/data"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - default
      - devassistant_net

  # One-shot: creates the tus-uploads bucket tusd's S3 store writes to. No
  # bucket exists by default, and tusd itself does not create one on startup.
  # Waits for minio's healthcheck (not just "container started") before
  # running, so the "connection refused" race during minio's own startup
  # doesn't show up as noisy (though harmless/self-retrying) error output.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1) do sleep 1; done;
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb -p local/tus-uploads || true;
      exit 0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - default
      - devassistant_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    mem_limit: 1g
    volumes:
      - "qdrant-data:/qdrant/storage"
    ports:
      - "6333:6333"
      - "6334:6334"

  # Property-graph backend for the LlamaIndex hybrid retrieval layer. Holds
  # CodeSymbol nodes + CALLS edges (structure only); embeddings live in Qdrant.
  # No APOC / vector-index plugins required — the layer uses core Cypher only.
  neo4j:
    image: neo4j:5.26.0
    container_name: neo4j
    mem_limit: 1g
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - "neo4j-data:/data"
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - default
      - devassistant_net

volumes:
  minio-data:
  qdrant-data:
  neo4j-data:

networks:
  default: {}
  devassistant_net:
    external: true
