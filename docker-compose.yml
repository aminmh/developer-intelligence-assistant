services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_TUS_THRESHOLD_BYTES: ${VITE_TUS_THRESHOLD_BYTES:-}
    container_name: web
    env_file:
      - .env
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      PYTHON_API_URL: http://python-api:9002
      OLLAMA_IMPORT_ROOT: /ollama-imports
      OLLAMA_IMPORT_HOST_ROOT: ${OLLAMA_IMPORT_HOST_ROOT:-./ollama-imports}
    ports:
      - "3000:3000"
    volumes:
      - "./data:/app/data"
      - "${OLLAMA_IMPORT_HOST_ROOT:-./ollama-imports}:/ollama-imports:ro"
    restart: unless-stopped
    networks:
      - default
      - devassistant_net

  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: web-dev
    working_dir: /workspace
    command:
      - sh
      - -c
      - >-
        lock_hash="$$(sha256sum /workspace/package-lock.json | cut -d ' ' -f1)";
        if [ ! -f /workspace/node_modules/.deps-lock.sha256 ] || [ "$${lock_hash}" != "$$(cat /workspace/node_modules/.deps-lock.sha256 2>/dev/null)" ]; then
        cd /workspace;
        if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi;
        printf '%s' "$${lock_hash}" > /workspace/node_modules/.deps-lock.sha256;
        fi;
        rm -rf /workspace/node_modules/@esbuild/darwin-* /workspace/node_modules/tsx/node_modules/@esbuild/darwin-*;
        exec npm run dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      OLLAMA_URL: http://host.docker.internal:11434
      PYTHON_API_URL: http://python-api:9002
      OLLAMA_IMPORT_ROOT: /ollama-imports
      OLLAMA_IMPORT_HOST_ROOT: ${OLLAMA_IMPORT_HOST_ROOT:-./ollama-imports}
    ports:
      - "3000:3000"
    volumes:
      - ".:/workspace"
      - "${OLLAMA_IMPORT_HOST_ROOT:-./ollama-imports}:/ollama-imports:ro"
      - type: volume
        source: web-dev-node-modules
        target: /workspace/node_modules
        volume:
          nocopy: true
    profiles:
      - dev
    networks:
      - default
      - devassistant_net

networks:
  default: {}
  devassistant_net:
    external: true

volumes:
  web-dev-node-modules:
