services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_UPLOAD_API_URL: ${VITE_UPLOAD_API_URL:-}
        VITE_TUS_THRESHOLD_BYTES: ${VITE_TUS_THRESHOLD_BYTES:-}
    container_name: web
    env_file:
      - .env
    environment:
      PHP_SERVICE_URL: http://php-ast:9003
      OLLAMA_URL: http://host.docker.internal:11434
      PYTHON_API_URL: http://python-api:9002
      OLLAMA_IMPORT_ROOT: /ollama-imports
      OLLAMA_IMPORT_HOST_ROOT: ${OLLAMA_IMPORT_HOST_ROOT:-./ollama-imports}
    ports:
      - "3000:3000"
    volumes:
      - "./data:/app/data"
      - "${OLLAMA_IMPORT_HOST_ROOT:-./ollama-imports}:/ollama-imports:ro"
    restart: unless-stopped
    networks:
      - default
      - devassistant_net

  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: web-dev
    working_dir: /workspace
    command:
      - sh
      - -c
      - if [ ! -x /workspace/node_modules/.bin/tsx ] || [ ! -d /workspace/node_modules/tsx/node_modules/@esbuild/linux-arm64 ]; then find /workspace/node_modules -mindepth 1 -maxdepth 1 -exec rm -rf {} +; (cd /app/node_modules && tar cf - .) | (cd /workspace/node_modules && tar xf -); fi; rm -rf /workspace/node_modules/@esbuild/darwin-* /workspace/node_modules/tsx/node_modules/@esbuild/darwin-*; exec npm run dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PHP_SERVICE_URL: http://php-ast:9003
      OLLAMA_URL: http://host.docker.internal:11434
      PYTHON_API_URL: http://python-api:9002
      OLLAMA_IMPORT_ROOT: /ollama-imports
      OLLAMA_IMPORT_HOST_ROOT: ${OLLAMA_IMPORT_HOST_ROOT:-./ollama-imports}
    ports:
      - "3000:3000"
    volumes:
      - ".:/workspace"
      - "${OLLAMA_IMPORT_HOST_ROOT:-./ollama-imports}:/ollama-imports:ro"
      - type: volume
        source: web-dev-node-modules
        target: /workspace/node_modules
        volume:
          nocopy: true
    profiles:
      - dev
    networks:
      - default
      - devassistant_net

networks:
  default: {}
  devassistant_net:
    external: true

volumes:
  web-dev-node-modules:
