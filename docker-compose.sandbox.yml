# Nested gVisor sandbox backend for the reproduce pipeline — dev parity on
# macOS/Apple Silicon. Brings up a Docker-in-Docker daemon with runsc
# installed and registered; the orchestrator points DOCKER_HOST at it.
# Production Linux hosts keep a host-installed runsc (scripts/install-gvisor.sh)
# and the pipeline code is identical for both backends.
#
# SECURITY: the DinD daemon is unauthenticated (no TLS) and must never be
# reachable outside this compose project. The network is `internal: true` and
# NO host port is published for 2375. `privileged: true` is required by DinD
# itself — this is the removed boundary documented in the sandbox spec's
# privilege tradeoff (gVisor now guards the untrusted project code, not the
# runner).

name: dev-assistant-sandbox

services:
  sandbox-runner:
    build:
      context: ./sandbox-runner
    image: dev-assistant-sandbox-runner:latest
    privileged: true
    environment:
      # Plain TCP daemon — only reachable on the internal network.
      DOCKER_TLS_CERTDIR: ""
    command:
      - dockerd-entrypoint.sh
      - --host=unix:///var/run/docker.sock
      - --host=tcp://0.0.0.0:2375
    volumes:
      - dind-storage:/var/lib/docker
    networks:
      - sandbox-internal
      # Durable egress for the dependency-resolution tier (docker pull +
      # composer install need packagist reach). Inner runsc probe containers
      # still run --network=none; only the DinD daemon itself has internet.
      # Requires the main stack (api/docker-compose.yml) to be up first so the
      # external network exists.
      - app-egress

  # orchestrator — once the reproduce pipeline container exists, give it
  # DOCKER_HOST=tcp://sandbox-runner:2375 and JOBS_ROOT=/jobs and join this
  # network so it targets the nested daemon:
  #   environment:
  #     DOCKER_HOST: tcp://sandbox-runner:2375
  #     JOBS_ROOT: /jobs
  #   volumes:
  #     - jobs:/jobs
  #   networks:
  #     - sandbox-internal

volumes:
  dind-storage:
  jobs: # shared with the orchestrator at /jobs (both containers, same path)

networks:
  sandbox-internal:
    internal: true
  app-egress:
    external: true
    name: api_default
